name: CI Test & Docker Image Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: pricepulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Typecheck, Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build API and Web production bundles
        run: npm run build

      - name: Run URL & SKU parser unit tests
        run: node apps/api/test-product-url.cjs

  docker-image:
    name: Build & Publish Docker Image
    needs: test-and-build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production Docker image
        run: |
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${GITHUB_SHA::12}"
          docker build -t "${IMAGE_REPO}:${IMAGE_TAG}" -t "${IMAGE_REPO}:latest" .
          echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Container runtime smoke test
        run: |
          docker run -d --name pricepulse-smoke -p 3001:3001 "${IMAGE_REPO}:${IMAGE_TAG}"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health | grep -q '"status":"ok"'; then
              curl -fsS http://127.0.0.1:3001/ | grep -q '<div id="root"></div>'
              echo "Container smoke test passed!"
              docker rm -f pricepulse-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs pricepulse-smoke
          docker rm -f pricepulse-smoke
          exit 1

      - name: Push Docker image to GHCR
        run: |
          docker push "${IMAGE_REPO}:${IMAGE_TAG}"
          docker push "${IMAGE_REPO}:latest"
