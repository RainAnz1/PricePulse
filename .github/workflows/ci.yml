name: CI Test & Docker Image Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pricepulse-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Typecheck, Build & Unit Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build API and Web production bundles
        run: npm run build

      - name: Run parser and platform regression tests
        run: node --test apps/api/test-*.cjs

  docker-image:
    name: Build & Validate Docker Image
    needs: test-and-build
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build production Docker image
        run: |
          IMAGE_REPO="ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${GITHUB_SHA::12}"
          docker build -t "${IMAGE_REPO}:${IMAGE_TAG}" .
          echo "IMAGE_REPO=${IMAGE_REPO}" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${IMAGE_TAG}" >> "$GITHUB_ENV"

      - name: Container runtime smoke test
        run: |
          docker run -d --name pricepulse-smoke "${IMAGE_REPO}:${IMAGE_TAG}"
          trap 'docker rm -f pricepulse-smoke >/dev/null' EXIT
          for i in $(seq 1 30); do
            if docker exec pricepulse-smoke curl -fsS http://127.0.0.1:3001/api/health | grep -q '"status":"ok"'; then
              docker exec pricepulse-smoke curl -fsS http://127.0.0.1:3001/ | grep -q '<div id="root"></div>'
              docker exec -e LOCALAPPDATA=/tmp/pricepulse-smoke-data pricepulse-smoke node -e '
                const assert = require("node:assert/strict");
                const { mkdirSync, readlinkSync, symlinkSync } = require("node:fs");
                const { join } = require("node:path");
                const { getDataRoot, getJdHeadlessContext, getTaobaoHeadlessContext } = require("./apps/api/dist/sessions");
                const profile = join(getDataRoot(), "PriceDrop", "browser-profiles", "shared-headless");
                const lock = join(profile, "SingletonLock");
                mkdirSync(profile, { recursive: true });
                symlinkSync("old-pricepulse-container-922337", lock);
                symlinkSync("/tmp/pricepulse-exited-chromium/SingletonSocket", join(profile, "SingletonSocket"));
                symlinkSync("38024", join(profile, "SingletonCookie"));
                (async () => {
                  const [jd, taobao] = await Promise.all([getJdHeadlessContext(), getTaobaoHeadlessContext()]);
                  assert.equal(jd, taobao);
                  try {
                    const page = await taobao.newPage();
                    await page.goto("data:text/html,<h1>PricePulse</h1>");
                    assert.equal(await page.locator("h1").innerText(), "PricePulse");
                    assert.ok((await page.screenshot()).length > 0);
                    assert.equal(readlinkSync(lock), "old-pricepulse-container-922337");
                  } finally {
                    await jd.close();
                  }
                })().catch(error => { console.error(error); process.exitCode = 1; });'
              echo "Container smoke test passed!"
              exit 0
            fi
            sleep 1
          done
          docker logs pricepulse-smoke
          exit 1

      - name: Push Docker image to GHCR
        run: |
          docker push "${IMAGE_REPO}:${IMAGE_TAG}"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            docker tag "${IMAGE_REPO}:${IMAGE_TAG}" "${IMAGE_REPO}:latest"
            docker push "${IMAGE_REPO}:latest"
          fi
